<html>
<head>
	<title>Policy Registration</title>
</head>
<body>
	<center>
		<h1>Policy Registration Form</h1>
		
		<form action="policyregister.java">
			<h2>Enter Customer Details:</h2>
			<table border="2" cellpadding="6">
				<tr>
					<td>Name:</td>
					<td><input type="text" name="name"></td>
				</tr>
				<tr>
					<td>ID:</td>
					<td><input type="text" pattern="[0-9]{10}" name="id"></td>
				</tr>
				<tr>
					<td>Password:</td>
					<td><input type="password" name="pass"></td>
				</tr>
				<tr>
					<td>D.O.B:</td>
					<td><input type="date" name="dob"></td>
				</tr>
				<tr>
					<td>Email:</td>
					<td><input type="email" name="email"></td>
				</tr>
				<tr>
					<td>Mobile Number:</td>
					<td><input type="text" name="mobile" pattern="[0-9]{10}"></td>
				</tr>
				<tr>
					<td>Address:</td>
					<td><input type="text" name="address"></td>
				</tr>
				<tr>
					<td>Pincode:</td>
					<td><input type="text" name="pincode" pattern="[0-9]{6}"></td>
				</tr>
				<tr>
					<td>Select Gender:</td>
					<td>
						<input type="radio" value="male" name="gender">Male 
						<input type="radio" value="female" name="gender">Female
					</td>
				</tr>
				<tr>
					<td>Married Status:</td>
					<td>
						<input type="radio" value="married" name="married_status">Married
						<input type="radio" value="unmarried" name="married_status">Unmarried
					</td>
				</tr>
				<tr>
					<td align="center"><input type="submit" value="Register"></td>
					<td align="center"><input type="reset" value="Refresh"></td>
				</tr>
			</table>
		</form>
	</center>
</body>
</html>
