<html>
<head>
	<title>Login Form</title>
</head>
<body>
	<center>
		<h1>Login Form</h1>
		<form action="Login.java">
			Enter Username: <input type="text" name="user" required><br><br>
			Enter Password: <input type="password" name="pass" minlength="8" maxlength="20"><br><br>
			Enter Age: <input type="number" name="age" min="18" max="50"><br><br>
			Enter DOB: <input type="date" name="dob"><br><br>
			Enter Exam Time: <input type="datetime-local" name="time"><br><br>
			Enter Email: <input type="email" name="email"><br><br>
			Enter URL: <input type="url" name="url"><br><br>
			Enter Mobile: <input type="text" name="mobile" pattern="[0-9]{10}"><br><br>
			
			<input type="submit" value="Login">
			<input type="reset" value="Refresh">
		</form>
	</center>
</body>
</html>
