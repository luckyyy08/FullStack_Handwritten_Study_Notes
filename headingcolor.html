<html>
<head>
	<title>DOM</title>
</head>
<body>
<script>
	function lightpink()
	{
		document.body.style.backgroundColor="black";
		document.getElementById("heading").style.color="black";
	}
	function white()
	{
		document.body.style.backgroundColor="white";
		document.getElementById("heading").style.color="white";
	}
</script>
<center>
	<h1 id="heading">Set Display</h1>
	<p>A paragraph is a group of sentence</p>
	<input type="button" value="DARK" onclick="lightpink()">
	<input type="button" value="LIGHT" onclick="white()">
</center>
</body>
</html>
