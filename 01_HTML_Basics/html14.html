<html>

	<head><title>BOOK TICKET</title></head>
	<body bgcolor="lightblue">
	
<center>

	<h1><font color="navy">BOOK TICKET</font></h1>

	<form action="book.Java">
	<table border="2" bgcolor="white" cellpadding="10">
		
		
		<tr>
			<td>From: <input type="text" name="from"></td>
			<td>To: <input type="text" name="to"></td>
		</tr>

		<tr>
			<td>
				DD/MM/YYYY *:<br>
				<input type="text" name="date" value="22/05/2026">
			</td>
			<td>
				Select Class:<br>
				<select name="class">
					<option value="All Classes">All Classes</option>
					<option value="Anubhuti Class (EA)">Anubhuti Class (EA)</option>
					<option value="AC First Class (1A)">AC First Class (1A)</option>
					<option value="Exec. Chair Car (EC)">Exec. Chair Car (EC)</option>
					<option value="AC 2 Tier (2A)" selected>AC 2 Tier (2A)</option>
					<option value="AC 3 Tier (3A)">AC 3 Tier (3A)</option>
					<option value="3 AC Economy (3E)">3 AC Economy (3E)</option>
					<option value="AC Chair car (CC)">AC Chair car (CC)</option>
					<option value="Sleeper (SL)">Sleeper (SL)</option>
					<option value="Second Sitting (2S)">Second Sitting (2S)</option>
				</select>
			</td>
			</tr>

			<tr>
			<td>
				Select Quota:<br>
				<select name="quota">
					<option value="GENERAL">GENERAL</option>
					<option value="LADIES" selected>LADIES</option>
					<option value="LOWER BERTH/SR.CITIZEN">LOWER BERTH/SR.CITIZEN</option>
					<option value="PERSON WITH DISABILITY">PERSON WITH DISABILITY</option>
					<option value="DUTY PASS">DUTY PASS</option>
					<option value="TATKAL">TATKAL</option>
					<option value="PREMIUM TATKAL">PREMIUM TATKAL</option>
				</select>
			</td>
			<td></td>
			</tr>

			<tr>
			<td colspan="2">
				<input type="checkbox" name="disability" checked> Person With Disability Concession <br><br>
				<input type="checkbox" name="flexible"> Flexible With Date <br><br>
				<input type="checkbox" name="pass"> Railway Pass Concession
				</td>
			</tr>

			<tr>
			<td colspan="2" align="center">
				<input type="submit" value="Search Trains">
				<input type="reset" value="Refresh">
			</td>
		</tr>
	</table>
	</form>

</center>
</body>
</html>
