<html>
<head>
	<title>Unordered List</title>
	<style>
		ul {
			list-style-position: inside;
		}
	</style>
</head>
<body bgcolor="plum">
	<center>
		<h1>UNORDERED LIST</h1>

		<h3>Disc List</h3>
		<ul type="disc">
			<li>Physics</li>
			<li>Chemistry</li>
			<li>Maths</li>
		</ul>

		<h3>Circle List</h3>
		<ul type="circle">
			<li>Marathi</li>
			<li>English</li>
			<li>Hindi</li>
		</ul>

		<h3>Square List</h3>
		<ul type="square">
			<li>Accounts</li>
			<li>Economics</li>
			<li>Commerce</li>
		</ul>
	</center>
</body>
</html>
