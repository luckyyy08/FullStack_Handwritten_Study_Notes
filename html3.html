<html>
<head>
	<title>Bank Details</title>
</head>
<body>
	<center>
		<h1>Bank Form</h1>
		<form action="bank.java">
			Enter Bank Name: <input type="text" name="bank_name"><br><br>
			Enter Branch Name: <input type="text" name="branch_name"><br><br>
			Enter Account Number: <input type="text" name="account_no" pattern="[0-9]{12}"><br><br>
			Enter IFSC Code: <input type="text" name="ifsc_code"><br><br>
			Enter Address: <input type="text" name="address"><br><br>
			Enter Mobile Number: <input type="text" name="mobile" pattern="[0-9]{10}"><br><br>

			<input type="submit" value="SignUp">
			<input type="reset" value="Refresh">
		</form>
	</center>
</body>
</html>
