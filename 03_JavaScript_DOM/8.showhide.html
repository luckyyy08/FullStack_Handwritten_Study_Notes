<html>
<head>
	<title>DOM</title>
</head>
<body>
<script>
	function show()
	{
		document.getElementById("update").innerHTML="A paragraph is a group of sentence";
	}
	function hide()
	{
		document.getElementById("update").innerHTML="";
	}
</script>
<center>
	<h1>Set Display</h1>
	<p id="update">A paragraph is a group of sentence</p>

	<input type="button" value="Show" onclick="show()">
	<input type="button" value="Hide" onclick="hide()">
</center>
</body>
</html>
