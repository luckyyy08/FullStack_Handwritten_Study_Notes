<html>
<head>
	<title>Nested List</title>
	<style>
		ul, ol {
			list-style-position: inside;
		}
	</style>
</head>
<body bgcolor="plum">
	<center> 
		<h1><font color="red">NESTED LIST</font></h1>

		<ul>
			<li>Science
				<ol>
					<li>Physics</li>
					<li>Chemistry</li>
					<li>Maths</li>
				</ol>
			</li>
			<li>Arts
				<ol>
					<li>Marathi</li>
					<li>English</li>
					<li>Hindi</li>
				</ol>
			</li>
			<li>Commerce
				<ol>
					<li>Account</li>
					<li>Maths</li>
					<li>English</li>
				</ol>
			</li>
		</ul>
	</center>
</body>
</html>
