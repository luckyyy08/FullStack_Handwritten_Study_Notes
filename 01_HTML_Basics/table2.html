<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<style>
.container
{
width:900px;
height:900px;
background-color:plum
}

</style>

<div class="container">
<div class="container-mt3">
  <h2>Stacked form</h2>
  <form action="/action_page.php">
  
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
	
    <div class="form-group">
      <label for="pwd">Password:</label>
      <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
    </div>
	
    <div class="form-group">
      <label for="pwd">age:</label>
      <input type="number" class="form-control" id="age" placeholder="Enter age" name="age">
    </div>

	<div class="form-group">
      <label for="pwd">phone:</label>
      <input type="phone" class="form-control" id="phone" placeholder="Enter number" name="{0-9}[10]">
    </div>

	<div class="form-group">
      <label for="pwd">pincode:</label>
      <input type="pincode" class="form-control" id="pincode" placeholder="Enter pincode" name="{0-9}[6]">
    </div>

	<div class="form-group">
      <label for="pwd">D.O.B:</label>
      <input type="DOB" class="form-control" id="DOB" placeholder="Enter DOB" name="DOB">
    </div>


				 <label for="sel1" class="form-label">Select list (select one):</label>
				<select class="form-select" id="city" name="city">
				<option>SAKRI</option>
				<option>NASHIK</option>
				<option>PUNE</option>
				<option>MUMBAI</option>
			</select>


	  <div class="form-check">
      <input type="checkbox" class="form-check-input" id="JAVA" name="COURCE" value="JAVA" checked>
      <label class="form-check-label" for="check1">JAVA</label>
    </div>

	  <div class="form-check">
      <input type="checkbox" class="form-check-input" id="PYTHON" name="COURCE" value="PYTHON" checked>
      <label class="form-check-label" for="check1">PYTHON</label>
    </div>



	  <div class="form-check">
      <input type="radio" class="form-check-input" id="radio1" name="gender" value="male" checked>male
      <label class="form-check-label" for="radio1">radio 1</label>
    </div>
	
      <div class="form-check">
      <input type="radio" class="form-check-input" id="radio2" name="gender" value="female">female
      <label class="form-check-label" for="radio2">radio 2</label>
    </div>


    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

</body>
</html>
