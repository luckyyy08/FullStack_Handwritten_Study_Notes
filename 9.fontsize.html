<html>
<head>
	<title>DOM</title>
</head>
<body>
<script>
	function small()
	{
		document.getElementById("update").style.fontSize="30px";
		document.getElementById("update").style.color="red";
		document.body.style.backgroundColor="lightblue";
	}

	function Medium()
	{
		document.getElementById("update").style.fontSize="60px";
		document.getElementById("update").style.color="blue";
		document.body.style.backgroundColor="lightcoral";
	}

	function Large()
	{
		document.getElementById("update").style.fontSize="90px";
		document.getElementById("update").style.color="green";
		document.body.style.backgroundColor="lightgreen";
	}
</script>
<center>
	<h1>Set Display</h1>
	<p id="update">A paragraph is a group of sentence</p>
	<input type="button" value="Small" onclick="small()">
	<input type="button" value="Medium" onclick="Medium()">
	<input type="button" value="Large" onclick="Large()">
</center>
</body>
</html>
