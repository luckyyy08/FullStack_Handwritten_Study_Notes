<html>

<head>

<body bgcolor="plum">

	<title>Login Form</title>
	</head>
	<center>

		<form action="login.java">

			<table border="3" cellpadding="8">

				<tr>
					<th>
						<font size="5px">PERSONAL DETAILS</font>
					</th>
				</tr>


				<tr>
					<td>
						<font color="783537">Enter Username: <input type="text" name="user">
					</td>
				</tr>
				<tr>
					<td>
						<font color="783537">Enter Password: <input type="password" name="pass">
					</td>
				</tr>
				<tr>
					<td>
						<font color="783537">Enter DOB: <input type="date" name="dob">
					</td>
				</tr>
				<tr>
					<td>
						<font color="783537">Enter Email: <input type="email" name="email">
					</td>
				</tr>
				<tr>
					<td>
						<font color="783537">Enter Mobile Number: <input type="text" name="mobile"
								pattern="[0-9]{10}">
					</td>
				</tr>
				<tr>
					<td>
						<font color="783537">Enter Gender:
							<font color="783537"><input type="radio" name="gender" value="male"> Male
								<font color="783537"><input type="radio" name="gender" value="female"> Female<br><br>
								</font>
					</td>
				</tr>
				</font>


				<tr>
					<th>
						<font size="5px">EDUCATIONAL QUALIFICATION</font>
					</th>
				</tr>


				<tr>
					<td>
						<font color="783537">Select degree:
							<select name="degree">
								<font color="783537">
									<option value="ingineer">INGINEER</option>
									<font color="783537">
										<option value="mba">MBA</option>
										<font color="783537">
											<option value="msa">MSA</option>
										</font>
							</select><br><br>
					</td>
				</tr>


				<tr>
					<td>
						<font color="783537">Select engineering:
							<select name="engineering">
								<font color="783537">
									<option value="civil">CIVIL INGINEER</option>
									<font color="783537">
										<option value="electrical">ELECTRICAL INGINEER</option>
										<font color="783537">
											<option value="compter">COMPUTER INGINEER</option>
										</font>
							</select><br><br>
					</td>
				</tr>


				<tr>
					<td>
						<font color="783537">Hobbies:<br>
							<font color="783537"><input type="checkbox" name="hobbies" value="java">PLAYING CHESS<br>
								<font color="783537"><input type="checkbox" name="hobbies" value="python">READING
									BOOKS<br><br>
					</td>
				</tr>




				<tr>
					<th>
						<font size="5px">ADDRESS<font>
					</th>
				</tr>

				<tr>
					<td><textarea name="address" rows="5" cols="55">Enter Address</textarea></td>
				</tr>



				<tr>
					<td>
						<font color="783537">Attach Resume:<input type="file" name="file"><br><br>
				</tr>
				</td>
				<tr><td><center><font color="783537"><input type="submit" value="SignUp"></font></center></td></tr>


		</form>
		</table>
	</center>
</body>

</html>
