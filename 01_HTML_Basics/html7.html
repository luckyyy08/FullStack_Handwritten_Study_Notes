<html>
<head>
	<title>Login Form</title>
</head>
<body>
	<center>
		<h1>Login Form</h1>
		<form action="login.java">
			Enter Username: <input type="text" name="user"><br><br>
			Enter Password: <input type="password" name="pass"><br><br>
			Enter Age: <input type="number" name="age" min="18" max="50"><br><br>
			Enter DOB: <input type="date" name="dob"><br><br>
			Enter Exam Time: <input type="datetime-local" name="datetime"><br><br>
			Enter Email: <input type="email" name="email"><br><br>
			Enter URL: <input type="url" name="url"><br><br>
			Enter Mobile Number: <input type="text" name="mobile" pattern="[0-9]{10}"><br><br>

			Enter Gender: 
			<input type="radio" name="gender" value="male"> Male
			<input type="radio" name="gender" value="female"> Female<br><br>
			
			Select Courses:<br>
			<input type="checkbox" name="courses" value="java"> Java<br>
			<input type="checkbox" name="courses" value="python"> Python<br><br>
			
			Select City:
			<select name="city">
				<option value="nashik">Nashik</option>
				<option value="pune">Pune</option>
				<option value="mumbai">Mumbai</option>
			</select><br><br>

			<input type="submit" value="SignUp">
			<input type="reset" value="Refresh">
		</form>
	</center>
</body>
</html>
