<body>
<center>   <h1>JAVASCRIPT button function</h1>

		<script>
		
		function add()
		{
		a=parseInt(document.GetElementById("txta").value)
		b=parseInt(document.GetElementById("txtb").value)
		c=a+b
		document.write("<br>addition is ",c)
		
		}
		function sub()
		{
		
		a=parseInt(document.GetElementById("txta").value)
		b=parseInt(document.GetElementById("txtb").value)
		c=a-b
		document.write("<br>subtraction is ",c)
		
		}
		function square()
		{
		a=parseInt(document.GetElementById("txta").value)
		b=parseInt(document.GetElementById("txtb").value)
		c=a*b
		document.write("<br>square is ",c)
		
		}

		</script>
		 
		<input type="text" id="txta"><br>
		<input type="text" id="txtb"><br><br>
		<input type="button" value="Add" onclick="add()">
		<input type="button" value="sub" onclick="sub()">
		<input type="button" value="square" onclick="square()">

		
		
				</center>
	</body>
	
	</html>
