<html>
<head><title>javascript</title><head>

<body>
<center>   <h1>JAVASCRIPT WHILE LOOP</h1>
<font color="red">
		<script>
		let i=1
		do
		{
		document.write("<br>",i)
			i++
		}
	
		while(i<=10);

	
		</script>
</font>
				</center>
	</body>
