<html>
<head><title>javascript</title><head>

<body>
<center>   <h1>JAVASCRIPT WHILE LOOP</h1>
<font color="Plum">
		<script>
		n=5,sum=0
		for(i=1;i<=n;i++)

		{
		if(i%2==0)
	      sum=sum+i
		  }
			document.write("<br>",sum)
	
		</script>
</font>
				</center>
	</body>
	
	</html>
